<div class="auth-page">
    <div class="auth-card auth-card--wide">
        <div class="page-header">
            <h1>Créer un compte</h1>
            <hr/>
        </div>

        <form class="auth-form auth-form--grid">
            <div class="form-group">
                <label for="prenom">Prénom <span class="required">*</span></label>
                <input type="text" id="prenom" name="prenom" placeholder="Mamoudou" required>
            </div>

            <div class="form-group">
                <label for="nom">Nom <span class="required">*</span></label>
                <input type="text" id="nom" name="nom" placeholder="Keita" required>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="monemail@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone <span class="required">*</span></label>
                <input type="tel" id="telephone" name="telephone" placeholder="00 00 00 00 00" required>
            </div>

            <div class="form-group form-group--full">
                <label for="naissance">Date de naissance</label>
                <input type="date" id="naissance" name="naissance">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="••••••••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer mot de passe <span class="required">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••••••••" required>
            </div>

            <button type="submit" class="btn-primary form-group--full">Créer un compte</button>
        </form>

        <div class="separator">
            <span></span>
            <p>Ou</p>
            <span></span>
        </div>

        <p class="switch-auth">
            Vous avez déjà un compte ?
            <a href="/connexion"><i class="bi bi-box-arrow-in-right"></i> Se connecter</a>
        </p>
    </div>
</div>
