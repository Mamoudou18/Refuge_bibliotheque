<div class="auth-page">
    <div class="auth-card">
        <div class="page-header">
            <h1>Connexion</h1>
            <hr/>
        </div>

        <form class="auth-form">
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="monemail@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="••••••••••••••" required>
            </div>

            <a href="/mot-de-passe-oublie" class="forgot-password">Mot de passe oublié ?</a>

            <button type="submit" class="btn-primary">Se connecter</button>
        </form>

        <div class="separator">
            <span></span>
            <p>Ou</p>
            <span></span>
        </div>

        <p class="switch-auth">Pas encore de compte ?</p>

        <a href="/inscription" class="btn-secondary">Créer un compte</a>
    </div>
</div>
