
<div class="container py-5">

    <!-- Titre -->
    <h1>Catalogue</h1>
    <hr>

    <!-- Barre de recherche -->
    <div class="row justify-content-center my-4">
        <div class="col-md-8">
            <input type="text" class="form-control recherche px-4" placeholder="Recherche un livre...">
        </div>
    </div>

    <!-- Filtres catégories -->
    <div class=" filtre mb-4">
        <button class="btn tous px-4">Tous</button>
        <button class="btn btn-filtre px-4">Roman</button>
        <button class="btn btn-filtre px-4">BD</button>
        <button class="btn btn-filtre px-4">Jeunesse</button>
        <button class="btn btn-filtre px-4">Doc</button>
    </div>

    <!-- Grille livres -->
    <div class="row g-4">

        <!-- Carte 1 -->
        <div class="col-12 col-md-3">
            <div class="card h-100 shadow-sm">
                <img src="/images/Aventures de Tom.webp" alt="Aventures de Tom" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                        <h3 class="card-title mb-0">Aventures de Tom</h3>
                        <span class="badge badge-roman flex-shrink-0">Roman</span>
                    </div>
                    <p class="text-muted text-small">Tom Sawyer</p>
                    <div class="mt-auto text-center">
                        <a href="/detail-livre" class="btn btn-decouvrir px-4">Découvrir</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carte 2 -->
        <div class="col-12 col-md-3">
            <div class="card h-100 shadow-sm">
                <img src="/images/Astérix T1.jpeg" alt="Astérix T1" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                        <h3 class="card-title mb-0">Astérix T1</h3>
                        <span class="badge badge-bd flex-shrink-0">BD</span>
                    </div>
                    <p class="text-muted text-small">Goscinny</p>
                    <div class="mt-auto text-center">
                        <a href="/detail-livre" class="btn btn-decouvrir px-4">Découvrir</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carte 3 -->
        <div class="col-12 col-md-3">
            <div class="card h-100 shadow-sm">
                <img src="/images/LePetitPrince.jpeg" alt="Le petit prince" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                        <h3 class="card-title mb-0">Le petit prince</h3>
                        <span class="badge badge-roman flex-shrink-0">Roman</span>
                    </div>
                    <p class="text-muted text-small">St-Exupéry</p>
                    <div class="mt-auto text-center">
                        <a href="/detail-livre" class="btn btn-decouvrir px-4">Découvrir</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carte 4 -->
        <div class="col-12 col-md-3">
            <div class="card h-100 shadow-sm">
                <img src="/images/Tintin Tibet T1.jpeg" alt="Tintin Tibet" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                        <h3 class="card-title mb-0">Tintin Tibet</h3>
                        <span class="badge badge-bd flex-shrink-0">BD</span>
                    </div>
                    <p class="text-muted text-small">Hergé</p>
                    <div class="mt-auto text-center">
                        <a href="/detail-libre" class="btn btn-decouvrir px-4">Découvrir</a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
