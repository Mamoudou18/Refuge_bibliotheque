<header class="header-sticky" role="banner">
    <nav class="navbar navbar-expand-lg" aria-label="Navigation principale">
        <div class="container-fluid">
            <a class="navbar-brand" routerLink="/home">
                <img src="/images/LogoRefuge.png" alt="Refuge - Retour à l'accueil">
            </a>
            <button class="navbar-toggler" type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#navbarNavDropdown" 
                    aria-controls="navbarNavDropdown" 
                    aria-expanded="false" 
                    aria-label="Ouvrir le menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/home" routerLinkActive="active" aria-current="page">
                            <i class="bi bi-house-door" aria-hidden="true"></i>Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/catalogue" routerLinkActive="active">
                            <i class="bi bi-book" aria-hidden="true"></i>Catalogue
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/emprunt" routerLinkActive="active">
                            <i class="bi bi-journal-check" aria-hidden="true"></i>Emprunts
                        </a>
                    </li>

                    <!-- Non connecté -->
                    <li class="nav-item" *ngIf="!isLoggedIn">
                        <a class="nav-link" routerLink="/connexion" routerLinkActive="active">
                            <i class="bi bi-person-check" aria-hidden="true"></i>Connexion
                        </a>
                    </li>
                    <li class="nav-item" *ngIf="!isLoggedIn">
                        <a class="nav-link" routerLink="/inscription" routerLinkActive="active">
                            <i class="bi bi-person-plus" aria-hidden="true"></i>Inscription
                        </a>
                    </li>

                    <!-- Connecté -->
                    <li class="nav-item dropdown" *ngIf="isLoggedIn">
                        <a class="nav-link dropdown-toggle" href="#" 
                           role="button" 
                           data-bs-toggle="dropdown" 
                           aria-expanded="false"
                           aria-label="Menu utilisateur">
                            <i class="bi bi-person-circle" aria-hidden="true"></i>{{ initiales }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" routerLink="/mon-compte">
                                    <i class="bi bi-person-gear" aria-hidden="true"></i>Mon Compte
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" routerLink="/deconnexion">
                                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>Déconnexion
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
