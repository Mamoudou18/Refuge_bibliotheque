services:
  postgresql:
    image: postgres:15.17-alpine3.23
    container_name: refuge_postgresql
    restart: always
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - refuge_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.14
    container_name: refuge_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - 5050:80
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - refuge_network

  mongo:
    image: mongo:7.0.34
    container_name: refuge_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - refuge_network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: refuge_mongo_express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - refuge_network

  php-fpm:
    build: ./backend
    container_name: refuge_php_fpm
    restart: always
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      postgresql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - refuge_network

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: refuge_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_dist:/shared
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "2000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /shared/browser/index.html"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1m30s
    networks:
      - refuge_network

  nginx:
    image: nginx:alpine
    container_name: refuge_nginx
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html
      - frontend_dist:/var/www/html/frontend
    depends_on:
      frontend:
        condition: service_healthy
      php-fpm:
        condition: service_started
      postgresql:
        condition: service_healthy
    networks:
      - refuge_network

volumes:
  postgres_data:
  pgadmin_data:
  mongo_data:
  frontend_dist:

networks:
  refuge_network: